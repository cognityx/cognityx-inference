[search]
ordered_axes = [
  "model",
  "backend",
  "quantization",
  "context_length",
  "batch_size",
  "generation_length",
]
monotonic_axes = ["context_length", "batch_size", "generation_length"]

[search.axes]
model = ["Qwen/Qwen3-8B"]
backend = ["transformers", "vllm"]
quantization = ["bf16", "int4"]
context_length = [512, 1024, 2048, 4096]
batch_size = [1, 2, 4]
generation_length = [128, 256, 512]

[limits]
request_timeout_seconds = 300
first_token_timeout_seconds = 60
no_token_progress_timeout_seconds = 30
minimum_tokens_per_second = 2
slow_window_seconds = 10
