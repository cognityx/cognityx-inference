[search]
ordered_axes = [
  "model",
  "backend",
  "quantization",
  "context_length",
  "kv_cache_precision",
  "batch_size",
  "generation_length",
]
monotonic_axes = ["context_length", "generation_length"]

[search.axes]
# Any locally cached or provider-supported model identifier may be used.
model = ["Qwen/Qwen3-8B"]
# Accepted local backends currently include "vllm" and "transformers".
backend = ["vllm"]
# Profiles supported by the selected backend can include "bf16", "fp16",
# "int8", and "int4". Keep only the profiles intended for this run here.
quantization = ["int4"]
# Supply finite, ascending candidates up to the model's declared limit and
# hardware boundary. Larger values are pruned after a slow/failed candidate.
context_length = [2048, 4096, 8192, 16384, 32768, 40960]
# KV-cache values commonly include "auto" and "fp8"; backend-specific values
# may be added when the selected backend supports them.
kv_cache_precision = ["auto", "fp8"]
# Batch size is useful for throughput/batched inference. Keep [1] for single
# request latency/capacity checks; add [2, 4, 8, ...] for batch evaluation.
batch_size = [1]
# Explicit generation-token candidates; increase this list for workload needs.
generation_length = [1024, 2048, 4096]

[limits]
request_timeout_seconds = 300
first_token_timeout_seconds = 60
no_token_progress_timeout_seconds = 30
minimum_tokens_per_second = 2
slow_window_seconds = 10

[workload]
# The fixed representative chat workload used for every discovery trial.
# Keep it close to your production data-preparation or RAG workload.
system_prompt = "You are a concise technical assistant."
user_prompt = "Briefly explain why model context capacity matters."
# Whether the selected model's reasoning mode is requested. Unsupported modes
# remain explicitly unavailable rather than being silently simulated.
enable_thinking = false
# Optional common generation settings. Remove/comment a value to use backend defaults.
temperature = 0.2
# top_p = 0.95
# top_k = 40
# min_p = 0.05
# seed = 42

[telemetry]
# Resource samples are collected during loading and inference, then stored as
# average/peak evidence in each trial and the certified profile.
interval_seconds = 0.25
# Optional JSON file written by the compatible Windows performance-counter
# bridge used by cognityx-training. It enables Windows host RAM/CPU and shared
# GPU-memory evidence alongside nvidia-smi dedicated memory/power/temperature.
# windows_bridge_path = "/mnt/d/AI/cognityx/windows-performance.json"
windows_bridge_max_age_seconds = 5
