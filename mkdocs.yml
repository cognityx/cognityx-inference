site_name: Cognityx Inference
site_description: Inference platform and hardware-boundary evaluation
repo_name: cognityx-inference
docs_dir: docs
theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy
nav:
  - Cognityx Home: https://cognityx.github.io/
  - Home: index.md
  - Platform: platform.md
  - CLI and Python client: cli.md
  - Interactive chat: chat.md
  - HTTP API: http-api.md
  - Discovery jobs: jobs.md
  - Boundary evaluation: boundary-evaluation.md
  - Configuration: configuration.md
  - Providers:
      - Overview: providers/index.md
      - OpenAI: providers/openai.md
      - Groq: providers/groq.md
      - Google Gemini: providers/gemini.md
      - Cerebras: providers/cerebras.md
      - OpenRouter: providers/openrouter.md
      - GitHub Models: providers/github-models.md
      - Cloudflare Workers AI: providers/cloudflare.md
      - Anthropic: providers/anthropic.md
  - Usage: usage.md
  - Architecture: architecture.md
  - Modules: modules/index.md
  - Design patterns: design-patterns.md
  - API reference: api/index.md
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            members_order: source
            separate_signature: true
            signature_crossrefs: true
            filters:
              - "!^_"
strict: true
