[project]
name = "cognityx-inference"
version = "0.1.0"
description = "Provider-neutral inference and hardware-boundary evaluation for Cognityx"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "bitsandbytes>=0.49.2",
    "datasets>=5.0.0",
    "evaluate>=0.4.6",
    "huggingface-hub[cli]>=1.24.0",
    "ipywidgets>=8.1.8",
    "jupyterlab>=4.6.1",
    "kernels>=0.15.2,<0.16",
    "safetensors>=0.8.0",
    "sentencepiece>=0.2.2",
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.28.0",
    "transformers>=5.14.1",
    "cognityx-storage",
    "cognityx-jobs",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
]
telemetry = [
    "psutil>=6.1",
]

[project.scripts]
cognityx-inference = "cognityx_inference.cli:main"
cognityx-boundary = "cognityx_inference.evaluation.cli:main"
llm-benchmark = "llm_benchmark.app:main"

[dependency-groups]
dev = [
    "mkdocs-material>=9.7.7",
    "mkdocstrings-python>=2.0.5",
    "pytest>=8",
]

[tool.uv.sources]
cognityx-storage = { git = "https://github.com/cognityx/cognityx-storage.git" }
cognityx-jobs = { git = "https://github.com/cognityx/cognityx-jobs.git" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cognityx_inference", "src/llm_benchmark"]
