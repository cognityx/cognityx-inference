[project]
name = "cognityx-inference"
version = "0.1.0"
description = "Provider-neutral inference and hardware-boundary evaluation for Cognityx"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "bitsandbytes>=0.49.2",
    "datasets>=5.0.0",
    "evaluate>=0.4.6",
    "huggingface-hub[cli]>=1.24.0",
    "ipywidgets>=8.1.8",
    "jupyterlab>=4.6.1",
    "kernels>=0.15.2,<0.16",
    "safetensors>=0.8.0",
    "sentencepiece>=0.2.2",
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.28.0",
    "transformers>=5.14.1",
    "cognityx-observability",
    "cognityx-storage",
    "cognityx-jobs",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
]
telemetry = [
    "psutil>=6.1",
]
tracking = [
    "mlflow>=2.20",
]

[project.scripts]
cognityx-inference = "cognityx_inference.cli:main"
cognityx-boundary = "cognityx_inference.evaluation.cli:main"
llm-benchmark = "llm_benchmark.app:main"

[dependency-groups]
dev = [
    "httpx2>=2.0",
    "mkdocs-material>=9.7.7",
    "mkdocstrings-python>=2.0.5",
    "mypy>=1.17",
    "pytest>=8",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
cognityx-observability = { git = "https://github.com/cognityx/cognityx-observability.git", rev = "b02ec3c103d0b3fd22b7c33888155b763d6baa9f" }
cognityx-storage = { git = "https://github.com/cognityx/cognityx-storage.git", rev = "9afe3ed85a16c993363ae75ffaef053f236319cf" }
cognityx-jobs = { git = "https://github.com/cognityx/cognityx-jobs.git" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cognityx_inference", "src/llm_benchmark"]

[tool.ruff]
line-length = 88
target-version = "py312"
include = [
    "src/cognityx_inference/api.py",
    "src/cognityx_inference/adapters.py",
    "src/cognityx_inference/cli.py",
    "src/cognityx_inference/client.py",
    "src/cognityx_inference/configuration.py",
    "src/cognityx_inference/contracts.py",
    "src/cognityx_inference/errors.py",
    "src/cognityx_inference/security.py",
    "src/cognityx_inference/service.py",
    "src/cognityx_inference/routing.py",
    "src/cognityx_inference/research.py",
    "src/cognityx_inference/tracking.py",
    "src/cognityx_inference/providers/*.py",
    "tests/test_inference_cli.py",
    "tests/test_inference_client.py",
    "tests/test_provider*.py",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E402", "E501"]

[tool.mypy]
python_version = "3.12"
files = [
    "src/cognityx_inference/adapters.py",
    "src/cognityx_inference/configuration.py",
    "src/cognityx_inference/contracts.py",
    "src/cognityx_inference/errors.py",
    "src/cognityx_inference/security.py",
    "src/cognityx_inference/routing.py",
    "src/cognityx_inference/research.py",
    "src/cognityx_inference/tracking.py",
    "src/cognityx_inference/providers",
]
exclude = [
    "^src/llm_benchmark/",
    "^tests/",
    "^src/cognityx_inference/(backends|evaluation)/",
    "^src/cognityx_inference/(?!adapters\\.py$|configuration\\.py$|contracts\\.py$|errors\\.py$|research\\.py$|routing\\.py$|security\\.py$|tracking\\.py$)[^/]+\\.py$",
]
follow_imports = "skip"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
